<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" width="920" height="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="920" height="610" fill="#faf9f5"/>

  <!-- ============ Left: decoder stack ============ -->
  <g stroke="#59636e" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <line x1="92" y1="62" x2="92" y2="99"/>
    <line x1="237" y1="62" x2="237" y2="99"/>
    <line x1="165" y1="134" x2="165" y2="159"/>
    <line x1="165" y1="262" x2="165" y2="283"/>
    <line x1="165" y1="410" x2="165" y2="435"/>
    <line x1="165" y1="466" x2="165" y2="489"/>
    <line x1="165" y1="522" x2="165" y2="545"/>
  </g>

  <rect x="30" y="30" width="125" height="32" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="92" y="50" text-anchor="middle">Text tokens</text>
  <rect x="175" y="30" width="125" height="32" rx="6" fill="#ffffff" stroke="#59636e" stroke-dasharray="4 3"/>
  <text x="237" y="44" text-anchor="middle">MoonViT (400M)</text>
  <text x="237" y="57" text-anchor="middle" font-size="10" fill="#59636e">image tokens</text>

  <rect x="30" y="100" width="270" height="34" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="165" y="121" text-anchor="middle">Embedding (163,840 × 7168)</text>

  <!-- Layer 0 -->
  <rect x="30" y="160" width="270" height="102" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="45" y="178" font-weight="600">Layer 0 · dense</text>
  <rect x="50" y="188" width="230" height="28" rx="5" fill="#ddf4ff" stroke="#0969da"/>
  <text x="165" y="206" text-anchor="middle">MLA attention</text>
  <rect x="50" y="226" width="230" height="28" rx="5" fill="#ffffff" stroke="#59636e"/>
  <text x="165" y="244" text-anchor="middle">Dense FFN (SwiGLU, 18,432)</text>

  <!-- Layers 1-60 -->
  <rect x="34" y="288" width="270" height="126" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <rect x="30" y="284" width="270" height="126" rx="8" fill="#f6f8fa" stroke="#59636e"/>
  <text x="45" y="302" font-weight="600">Layers 1–60 · MoE</text>
  <text x="285" y="302" text-anchor="end" font-weight="600" fill="#59636e">× 60</text>
  <rect x="50" y="312" width="230" height="28" rx="5" fill="#ddf4ff" stroke="#0969da"/>
  <text x="165" y="330" text-anchor="middle">MLA attention</text>
  <rect x="50" y="352" width="230" height="28" rx="5" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="165" y="370" text-anchor="middle">MoE FFN (384 routed + 1 shared)</text>
  <text x="165" y="398" text-anchor="middle" font-size="10" fill="#59636e">pre-RMSNorm + residual around each block</text>

  <rect x="30" y="436" width="270" height="30" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="165" y="455" text-anchor="middle">Final RMSNorm</text>
  <rect x="30" y="490" width="270" height="32" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="165" y="510" text-anchor="middle">LM head (7168 × 163,840)</text>
  <text x="165" y="562" text-anchor="middle" fill="#59636e">next-token logits</text>

  <!-- zoom connectors -->
  <g stroke="#59636e" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="280" y1="326" x2="350" y2="160"/>
    <line x1="280" y1="366" x2="350" y2="455"/>
  </g>

  <!-- ============ Right top: MLA ============ -->
  <rect x="350" y="20" width="550" height="282" rx="10" fill="#ffffff" stroke="#0969da"/>
  <text x="366" y="40" font-weight="600" fill="#0969da">MLA attention (per layer, 64 heads)</text>

  <g stroke="#59636e" stroke-width="1.3" fill="none">
    <line x1="450" y1="137" x2="460" y2="137"/>
    <line x1="460" y1="72" x2="460" y2="192"/>
  </g>
  <g stroke="#59636e" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <line x1="460" y1="72" x2="469" y2="72"/>
    <line x1="460" y1="142" x2="469" y2="142"/>
    <line x1="460" y1="192" x2="469" y2="192"/>
    <line x1="580" y1="72" x2="599" y2="72"/>
    <line x1="735" y1="72" x2="754" y2="72"/>
    <line x1="580" y1="142" x2="599" y2="142"/>
    <line x1="580" y1="192" x2="599" y2="192"/>
    <line x1="735" y1="165" x2="754" y2="165"/>
    <line x1="797" y1="200" x2="797" y2="239"/>
    <line x1="860" y1="86" x2="860" y2="239"/>
    <line x1="600" y1="257" x2="451" y2="257"/>
  </g>

  <rect x="370" y="120" width="80" height="34" rx="6" fill="#f6f8fa" stroke="#59636e"/>
  <text x="410" y="137" text-anchor="middle">h<tspan font-size="9" dy="3">t</tspan></text>
  <text x="410" y="149" text-anchor="middle" font-size="10" fill="#59636e">7168</text>

  <!-- query branch -->
  <rect x="470" y="55" width="110" height="34" rx="5" fill="#f6f8fa" stroke="#59636e"/>
  <text x="525" y="70" text-anchor="middle">W<tspan font-size="9" dy="3">DQ</tspan></text>
  <text x="525" y="83" text-anchor="middle" font-size="10" fill="#59636e">7168 → 1536</text>
  <rect x="600" y="55" width="135" height="34" rx="5" fill="#f6f8fa" stroke="#59636e"/>
  <text x="667" y="70" text-anchor="middle">W<tspan font-size="9" dy="3">UQ</tspan><tspan dy="-3">, W</tspan><tspan font-size="9" dy="3">QR</tspan></text>
  <text x="667" y="83" text-anchor="middle" font-size="10" fill="#59636e">up-project + RoPE</text>
  <rect x="755" y="55" width="125" height="34" rx="5" fill="#ddf4ff" stroke="#0969da"/>
  <text x="817" y="70" text-anchor="middle">q: 64 heads</text>
  <text x="817" y="83" text-anchor="middle" font-size="10" fill="#59636e">128 + 64 dims each</text>

  <!-- kv branch -->
  <rect x="470" y="125" width="110" height="34" rx="5" fill="#f6f8fa" stroke="#59636e"/>
  <text x="525" y="140" text-anchor="middle">W<tspan font-size="9" dy="3">DKV</tspan></text>
  <text x="525" y="153" text-anchor="middle" font-size="10" fill="#59636e">7168 → 512</text>
  <rect x="470" y="175" width="110" height="34" rx="5" fill="#f6f8fa" stroke="#59636e"/>
  <text x="525" y="190" text-anchor="middle">W<tspan font-size="9" dy="3">KR</tspan></text>
  <text x="525" y="203" text-anchor="middle" font-size="10" fill="#59636e">7168 → 64 (RoPE)</text>

  <rect x="600" y="118" width="135" height="94" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="667" y="138" text-anchor="middle" font-weight="600" fill="#9a6700">KV cache (FP8)</text>
  <text x="667" y="158" text-anchor="middle">c<tspan font-size="9" dy="3">KV</tspan><tspan dy="-3" dx="4">512 + k</tspan><tspan font-size="9" dy="3">R</tspan><tspan dy="-3" dx="4">64</tspan></text>
  <text x="667" y="176" text-anchor="middle" font-size="11">= 576 B</text>
  <text x="667" y="191" text-anchor="middle" font-size="10" fill="#59636e">per token per layer,</text>
  <text x="667" y="203" text-anchor="middle" font-size="10" fill="#59636e">shared by all heads</text>

  <rect x="755" y="130" width="85" height="70" rx="5" fill="#f6f8fa" stroke="#59636e"/>
  <text x="797" y="150" text-anchor="middle">W<tspan font-size="9" dy="3">UK</tspan><tspan dy="-3">, W</tspan><tspan font-size="9" dy="3">UV</tspan></text>
  <text x="797" y="166" text-anchor="middle" font-size="10" fill="#59636e">per-head K, V</text>
  <text x="797" y="179" text-anchor="middle" font-size="10" fill="#59636e">(or absorbed</text>
  <text x="797" y="191" text-anchor="middle" font-size="10" fill="#59636e">into q / W<tspan font-size="8" dy="2">O</tspan><tspan dy="-2">)</tspan></text>

  <rect x="600" y="240" width="280" height="34" rx="5" fill="#ddf4ff" stroke="#0969da"/>
  <text x="740" y="261" text-anchor="middle">64-head attention → W<tspan font-size="9" dy="3">O</tspan><tspan dy="-3" dx="4">(8192 → 7168)</tspan></text>
  <text x="410" y="275" text-anchor="middle" font-size="11" fill="#59636e">out (7168)</text>

  <text x="366" y="292" font-size="10.5" fill="#59636e">Only the amber latent is cached: 576 B × 61 layers = 35.1 KB per token.</text>

  <!-- ============ Right bottom: MoE ============ -->
  <rect x="350" y="318" width="550" height="272" rx="10" fill="#ffffff" stroke="#1a7f37"/>
  <text x="366" y="338" font-weight="600" fill="#1a7f37">MoE FFN (layers 1–60)</text>

  <g stroke="#59636e" stroke-width="1.3" fill="none">
    <line x1="450" y1="457" x2="460" y2="457"/>
    <line x1="460" y1="382" x2="460" y2="507"/>
  </g>
  <g stroke="#59636e" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <line x1="460" y1="382" x2="479" y2="382"/>
    <line x1="460" y1="457" x2="619" y2="457"/>
    <line x1="460" y1="507" x2="619" y2="507"/>
    <path d="M800,457 H840 V468"/>
    <path d="M800,507 H840 V496"/>
    <line x1="853" y1="482" x2="884" y2="482"/>
  </g>
  <path d="M590,382 H790 V441" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
  <text x="690" y="376" text-anchor="middle" font-size="10" fill="#1a7f37">gate weights (top-8)</text>

  <rect x="370" y="440" width="80" height="34" rx="6" fill="#f6f8fa" stroke="#59636e"/>
  <text x="410" y="457" text-anchor="middle">h<tspan font-size="9" dy="3">t</tspan></text>
  <text x="410" y="469" text-anchor="middle" font-size="10" fill="#59636e">7168</text>

  <rect x="480" y="365" width="110" height="34" rx="5" fill="#f6f8fa" stroke="#59636e"/>
  <text x="535" y="380" text-anchor="middle">Router</text>
  <text x="535" y="393" text-anchor="middle" font-size="10" fill="#59636e">scores 384 experts</text>

  <!-- expert strip: 9 cells, 3 active -->
  <text x="620" y="434" font-size="10.5" fill="#59636e">384 routed experts</text>
  <g stroke="#59636e" stroke-width="1">
    <rect x="620" y="442" width="17" height="30" rx="2" fill="#2da44e"/>
    <rect x="640" y="442" width="17" height="30" rx="2" fill="#ffffff"/>
    <rect x="660" y="442" width="17" height="30" rx="2" fill="#ffffff"/>
    <rect x="680" y="442" width="17" height="30" rx="2" fill="#2da44e"/>
    <rect x="700" y="442" width="17" height="30" rx="2" fill="#ffffff"/>
    <rect x="743" y="442" width="17" height="30" rx="2" fill="#2da44e"/>
    <rect x="763" y="442" width="17" height="30" rx="2" fill="#ffffff"/>
    <rect x="783" y="442" width="17" height="30" rx="2" fill="#ffffff"/>
  </g>
  <text x="730" y="461" text-anchor="middle" fill="#59636e">…</text>

  <rect x="620" y="490" width="180" height="34" rx="5" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="710" y="511" text-anchor="middle">Shared expert (always on)</text>

  <circle cx="840" cy="482" r="13" fill="#ffffff" stroke="#59636e" stroke-width="1.3"/>
  <text x="840" y="487" text-anchor="middle" font-size="15">+</text>
  <text x="870" y="502" font-size="10.5" fill="#59636e">out</text>

  <text x="366" y="556" font-size="10.5" fill="#59636e">Each expert: SwiGLU 7168 → 2048 → 7168 (44M params). Green = selected for this token.</text>
  <text x="366" y="574" font-size="10.5" fill="#59636e">8 routed + 1 shared expert per token → ~32B of 1T params active.</text>
</svg>
